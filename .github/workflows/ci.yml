name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest Python with the oldest versions requirements.txt allows
          - python: "3.11"
            deps: lowest
          # newest Python with the newest versions
          - python: "3.13"
            deps: highest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution ${{ matrix.deps == 'lowest' && 'lowest-direct' || 'highest' }} -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: End-to-end pipeline
        run: |
          python make_data.py
          python train.py
          python simulate.py

  evidently:
    name: evidently agreement + report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (separate environment, Evidently needs pandas < 3)
        run: pip install -r requirements-evidently.txt pytest
      - name: drift.py agrees with Evidently
        run: python -m pytest tests/test_evidently_agreement.py tests/test_drift.py
      - name: Build an example report
        run: |
          python make_data.py
          python train.py --no-tune
          python simulate.py
          python drift_report.py --batch 9
      - uses: actions/upload-artifact@v4
        with:
          name: evidently-drift-report
          path: reports/
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Known vulnerabilities in the locked dependencies
        run: pip-audit -r requirements-lock.txt --require-hashes --disable-pip
      - name: Lock file matches requirements
        run: |
          pip install uv
          uv pip compile -q requirements-api.txt --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --generate-hashes -o requirements-lock.txt --custom-compile-command "uv pip compile requirements-api.txt --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --generate-hashes -o requirements-lock.txt"
          git diff --exit-code requirements-lock.txt || (echo "::error::requirements-lock.txt is out of date: run the uv pip compile command at its top and commit" && exit 1)

  docker:
    name: docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: API_KEY=ci-key-0123456789abcdef docker compose config --quiet
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t mlops-observatory:ci .
      - name: Production image refuses to start without an API key
        run: |
          if docker run --rm mlops-observatory:ci python -c "import serve; serve.Settings.from_env()"; then
            echo "::error::the API started without API_KEY"; exit 1
          fi
      - name: Smoke test the API
        env:
          KEY: ci-key-0123456789abcdef
        run: |
          docker run -d --name api -p 8000:8000 -e API_KEY=$KEY mlops-observatory:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break
            sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' api | grep -q healthy
          curl -fsS localhost:8000/ready
          curl -fsS localhost:8000/version | grep -q "${{ github.sha }}"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H 'content-type: application/json' -d '{}')" = 401
          curl -fsS -X POST localhost:8000/predict -H "X-API-Key: $KEY" -H 'content-type: application/json' \
            -d '{"clients":[{"credit_limit":50000,"age":29,"education":2,"marriage":2,"repay_status_sep":2,"repay_status_aug":2,"repay_status_jul":0,"bill_sep":48000,"paid_sep":0,"paid_aug":1500}]}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['model_version']=='v1' and 0<=d['predictions'][0]['default_probability']<=1; print(d)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H "X-API-Key: $KEY" -H 'content-type: application/json' -d '{"clients":[{"age":5}]}')" = 422
          curl -fsS localhost:8000/metrics -H "X-API-Key: $KEY" | grep -q observatory_predictions_total
          test "$(docker exec api id -u)" = 10001
      - name: Smoke test the dashboard
        run: |
          docker run -d --name dash -p 8501:8501 mlops-observatory:ci dashboard
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' dash)" = healthy ] && break
            sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' dash | grep -q healthy
      - name: MLflow UI image reads the store the app image built
        run: |
          docker build -f Dockerfile.mlflow -t mlops-observatory-mlflow:ci .
          docker volume create models
          docker run --rm -v models:/app/models mlops-observatory:ci true   # copies the image's store into the volume
          docker run -d --name mlflow -p 5000:5000 -v models:/app/models mlops-observatory-mlflow:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mlflow)" = healthy ] && break
            sleep 3
          done
          curl -fsS "localhost:5000/api/2.0/mlflow/registered-models/alias?name=credit-default&alias=champion" \
            | python3 -c "import json,sys; v=json.load(sys.stdin)['model_version']; assert str(v['version'])=='1', v; print('champion is v1')"
      - name: Container logs on failure
        if: failure()
        run: docker logs api; docker logs dash; docker logs mlflow || true
