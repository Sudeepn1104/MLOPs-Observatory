name: Release image

# Publishes the Docker image to GitHub Container Registry after CI passes on
# main, and for version tags (v1.2.3). The image is scanned for critical
# vulnerabilities and published with an SBOM and build provenance.
#   ghcr.io/<owner>/mlops-observatory:latest   newest main
#   ghcr.io/<owner>/mlops-observatory:sha-<7>  every main commit
#   ghcr.io/<owner>/mlops-observatory:1.2.3    tags
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mlops-observatory" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: observatory:scan
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: observatory:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
