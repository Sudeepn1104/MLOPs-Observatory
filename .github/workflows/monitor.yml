name: Scheduled model check

# Weekly health check of the model. When the retrain rule fires it opens one
# GitHub issue labelled drift-alert (or updates the open one), and it closes
# that issue once the model is healthy again.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      scenario:
        description: >-
          drifted: check v1 after the 10 drifted batches (the alert should fire).
          retrained: retrain, stream 2 batches to the new model, then check (should be healthy).
        type: choice
        options: [drifted, retrained]
        default: drifted

permissions:
  contents: read
  issues: write

concurrency:
  group: model-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Build data, model v1 and monitoring history
        run: |
          python make_data.py
          python train.py
          python simulate.py
      - name: Retrain and stream new batches
        if: inputs.scenario == 'retrained'
        run: |
          python retrain.py --trigger "scheduled check (retrained scenario)"
          python monitor.py stream 2
      - name: Run the check
        id: check
        run: |
          set +e
          python check.py --json report.json --markdown report.md
          code=$?
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then echo "::error::the check itself failed"; exit 2; fi
          echo "alert=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the drift-alert issue
        uses: actions/github-script@v7
        env:
          ALERT: ${{ steps.check.outputs.alert }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
            const body = fs.readFileSync('report.md', 'utf8');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'drift-alert';
            const footer = `\n---\n_Opened by the [scheduled model check](${run}). This issue is updated in place on every run and closed automatically when the model is healthy again._\n`;

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'd73a4a',
                description: 'Opened by the scheduled model check when the retrain rule fires',
              });
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find(i => !i.pull_request);

            if (process.env.ALERT === 'true') {
              const title = `Drift alert: retrain rule fired for ${report.model}`;
              if (existing) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, title, body: body + footer });
                core.notice(`Updated alert issue #${existing.number}`);
              } else {
                const { data } = await github.rest.issues.create({ ...context.repo, title, body: body + footer, labels: [label] });
                core.notice(`Opened alert issue #${data.number}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body: `Resolved: ${report.model} is ${report.status} again.\n\n${body}\n[Check run](${run})`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              core.notice(`Closed alert issue #${existing.number}`);
            } else {
              core.notice(`No alert: ${report.model} is ${report.status}.`);
            }
